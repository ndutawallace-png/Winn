/* ---------- recurring invoice automation ---------- */
let billing=false;
async function autoBill(){
 if(billing||!ready.clients||!ready.invoices)return;billing=true;
 for(const c of S.clients){
  if(c.active===false||!c.nextDue)continue;let d=c.nextDue,changed=false;
  while(diff(d)<=BILL_AHEAD_DAYS){
   const id=`${c.id}_${d}`;
   if(!S.invoices.some(i=>i.id===id))await setDoc(dref('invoices',id),{clientId:c.id,clientName:c.name,amount:(+c.amount||0),due:d,status:'pending',frequency:c.frequency});
   d=addMonths(d,STEP[c.frequency]||1);changed=true;
  }
  if(changed)await upd('clients',c.id,{nextDue:d});
 }
 billing=false;
}

function companyMeta(){
 const raw=((S.settings||[]).find(x=>x&&x.id==='companies'))||{};
 const list=Array.isArray(raw.list)?raw.list:[];
 const kinds=(raw.kinds&&typeof raw.kinds==='object')?raw.kinds:{};
 // defaults
 const meta={
  'Twocan':{kind:'normal',label:'Twocan',ref:'Normal client work (invoicing, books, reports)'},
  'Lone Tree Villas':{kind:'realestate',label:'LTV',ref:'Real estate (service charge, vendors, estate)'},
  'Sarah':{kind:'normal',label:'Sarah',ref:'Salary / normal client matters'}
 };
 list.forEach(n=>{
  if(typeof n==='string'){if(!meta[n])meta[n]={kind:kinds[n]||'normal',label:n,ref:kinds[n]==='realestate'?'Real estate (like LTV)':'Normal client (like Twocan)'}}
  else if(n&&n.name){meta[n.name]={kind:n.kind||'normal',label:n.name,ref:n.kind==='realestate'?'Real estate (like LTV)':'Normal client (like Twocan)'}}
 });
 Object.entries(kinds).forEach(([n,k])=>{if(meta[n])meta[n].kind=k;else meta[n]={kind:k,label:n,ref:k==='realestate'?'Real estate (like LTV)':'Normal client (like Twocan)'}});
 (S.clients||[]).forEach(c=>{

 });
 return meta;
}

const REPEAT_OPTS=['None','Daily','Weekly','Monthly'];
function nextTaskDue(due,rep){
 const base=due||TODAY;
 if(rep==='Daily')return addDays(base,1);
 if(rep==='Weekly')return addDays(base,7);
 if(rep==='Monthly')return addMonths(base,1);
 return base;
}

 const i=S.invoices.filter(x=>x.status!=='paid').map(x=>({kind:'invoice',id:x.id,title:`${x.clientName} invoice`,due:x.due,p:'Mid',remind:3,sent:x.status==='sent'}));

   weekday:'short',day:'numeric',month:'short',timeZoneName:'longOffset'
  }).formatToParts(new Date()).forEach(x=>{p[x.type]=x.value});
 }catch(e){
  const d=new Date();
  p.hour=String(d.getHours());p.minute=String(d.getMinutes());p.second=String(d.getSeconds());
  p.weekday='';p.day=String(d.getDate());p.month='';p.timeZoneName='GMT';

};
const offH=t=>{

};

}

function tick(){
 const zones=typeof loadZones==='function'?loadZones():[];
 if(!zones.length)return;
 const homeTz=(zones[0]&&zones[0].tz)||'Africa/Nairobi';
 let hm;try{hm=zt(homeTz)}catch(e){return}
 zones.forEach((z,i)=>{
  let p;try{p=zt(z.tz)}catch(e){return}
  const h=(parseInt(p.hour,10)||0)%24,mi=parseInt(p.minute,10)||0,sc=parseInt(p.second,10)||0;
  const pad=v=>String(v).padStart(2,'0');
  const timeStr=pad(h)+':'+pad(mi);
  const el=document.getElementById('ck'+i);
  if(!el)return;
  const dig=el.querySelector('.wc-digital');
  if(dig){
   const d=offH(p.timeZoneName)-offH(hm.timeZoneName);
   const off=Math.abs(d)<0.01?'Local':((d>0?'+':'−')+Math.abs(d).toFixed(d%1?1:0)+'H');
   dig.textContent=timeStr+' · '+off;
  }
  // Rolex hands — rotate around dial centre 50,50
  const r=(q,a)=>{const n=el.querySelector(q);if(n)n.setAttribute('transform','rotate('+a+' 50 50)')};
  r('.hq',(h%12)*30+mi*0.5);
  r('.mq',mi*6+sc*0.1);
  r('.sq',sc*6);
 });
}

 const tr=pct(done.length,T.length),ot=pct(done.filter(t=>t.doneOn<=t.due).length,done.length),od=T.filter(t=>!t.done&&diff(t.due)<0).length;
 const dr=pct(D.reduce((t,d)=>t+lastN(7).filter(x=>isOn(d,x)).length,0),D.length*7),bn=B.map(billNext).sort(),bod=bn.filter(x=>diff(x)<0).length;

 const parts=[T.length?tr:null,D.length?dr:null].filter(x=>x!==null),score=parts.length?Math.round(parts.reduce((a,b)=>a+b)/parts.length):null;

 if(gap!==null&&gap>=3)reasons.push('No activity for '+gap+' days');if(gap===null&&rec===0)reasons.push('Nothing done yet');if(od)reasons.push(od+' overdue task'+(od>1?'s':''));if(bod)reasons.push(bod+' invoice date'+(bod>1?'s':'')+' overdue');if(D.length&&dr<50)reasons.push('Daily routine slipping');

let _sq='';
function searchIndex(){
 const L=[];
 const push=(tab,title,detail,id,go)=>{L.push({tab,title,detail,id,go})};
 S.tasks.forEach(t=>push('Tasks',t.title,(t.done?'Done · ':'')+(t.client||'')+' · due '+(t.due||''),t.id,'Tasks'));
 S.clients.forEach(c=>push('Billing',c.name,(c.email||'')+' · '+(c.frequency||''),c.id,'Billing'));
 S.invoices.forEach(i=>push('Billing',(i.clientName||'')+' invoice','Due '+(i.due||'')+' · '+(i.status||''),i.id,'Billing'));
 S.billing.forEach(b=>push('Billing',b.name,'For '+(b.owner||'')+' · next cycle',b.id,'Billing'));
 S.payables.forEach(p=>push('Payables',p.supplier,(p.owner||'')+' · '+(p.type||'')+' · '+(p.status||'open'),p.id,'Payables'));
 S.accounts.forEach(a=>{
  const bal=money(accBal(a));
  push('Money',accIconText(a)+' · '+a.name,(a.kind||'Account')+' · balance '+bal,a.id,'Money');
  push('Cashflow',a.name,(a.kind||'')+' · '+bal,a.id,'Cashflow');
 });
 S.plans.forEach(p=>push('Savings',p.name,'Saved '+money(p.saved)+' of '+money(p.target),p.id,'Savings'));
 S.employees.forEach(e=>push('Payroll',e.name,(e.role||'')+' · '+(e.client||''),e.id,'Payroll'));
 S.goals.forEach(g=>push('Goals',g.title,(g.area||'')+' · '+(g.progress||0)+'%',g.id,'Goals'));
 S.txns.slice(-80).forEach(t=>push('Cashflow',t.note||t.category||t.type,(t.type||'')+' · '+(t.date||'')+' · '+money(t.amount),t.id,'Cashflow'));
 S.recurring.forEach(r=>push('Budget',r.name,(r.type||'')+' · '+(r.category||'')+' · '+money(r.amount),r.id,'Budget'));
 return L;
}
function runGlobalSearch(q){
 const box=$('#searchHits'),inp=$('#qsearch');if(!box)return;
 _sq=(q||'').trim().toLowerCase();
 const main=$('#main');
 if(!_sq){
  if(main){main.classList.remove('filtering');main.querySelectorAll('.match').forEach(e=>e.classList.remove('match'))}
  if(document.activeElement===inp){
   const accs=(S.accounts||[]).map(a=>({
    tab:'Account',title:a.name,iconHtml:accIcon(a),detail:(a.kind||'Account')+' · '+money(accBal(a)),id:a.id,go:'Money'
   }));
   if(!accs.length){box.innerHTML='<div class="empty" style="padding:14px">No accounts yet. Add one under Money / Cashflow.</div>';box.classList.add('on');return}
   box.innerHTML='<div style="padding:8px 14px 4px;font-size:.75rem;color:var(--mute);font-weight:600">Quick account access</div>'+
    accs.map((h,i)=>`<button type="button" class="hit" data-i="${i}" role="option"><div><b style="display:flex;align-items:center;gap:6px">${h.iconHtml||''}<span>${esc(h.title)}</span></b><small>${esc(h.detail)}</small></div><span class="tag">${esc(h.tab)}</span></button>`).join('');
   box.classList.add('on');
   box.querySelectorAll('.hit').forEach((btn,i)=>{
    btn.onclick=()=>{box.classList.remove('on');if(inp)inp.value='';app.go(accs[i].go||'Money')};
   });
   return;
  }
  box.classList.remove('on');box.innerHTML='';return;
 }
 if(main){
  main.classList.add('filtering');
  main.querySelectorAll('.row, tr').forEach(el=>{
   const t=(el.textContent||'').toLowerCase();
   el.classList.toggle('match', t.includes(_sq));
  });
 }
 let hits=searchIndex().filter(h=>(h.title+' '+h.detail+' '+h.tab).toLowerCase().includes(_sq));
 hits.sort((a,b)=>{
  const aa=/account|money|cashflow|savings|m-?shwari|cic|💳/i.test(a.tab+' '+a.title)?0:1;
  const bb=/account|money|cashflow|savings|m-?shwari|cic|💳/i.test(b.tab+' '+b.title)?0:1;
  return aa-bb;
 });
 hits=hits.slice(0,40);
 if(!hits.length){box.innerHTML='<div class="empty" style="padding:14px">No matches for “'+esc(_sq)+'”</div>';box.classList.add('on');return}
 box.innerHTML=hits.map((h,i)=>`<button type="button" class="hit" data-i="${i}" role="option"><div><b>${esc(h.title)}</b><small>${esc(h.detail)}</small></div><span class="tag">${esc(h.tab)}</span></button>`).join('');
 box.classList.add('on');
 box.querySelectorAll('.hit').forEach((btn,i)=>{
  btn.onclick=()=>{const h=hits[i];box.classList.remove('on');if(inp)inp.value='';if(h.go)app.go(h.go)};
 });
}

function wireSearch(){
 const inp=$('#qsearch'),box=$('#searchHits');if(!inp||inp._wired)return;inp._wired=1;
 let t=0;
 inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>runGlobalSearch(inp.value),120)});
 inp.addEventListener('focus',()=>{runGlobalSearch(inp.value||'')});
 inp.addEventListener('keydown',e=>{if(e.key==='Escape'){inp.value='';runGlobalSearch('');inp.blur()}});
 document.addEventListener('click',e=>{if(box&&!box.contains(e.target)&&e.target!==inp)box.classList.remove('on')});
}

const BLOCK_REPEAT=['None','Daily','Weekdays (Mon–Fri)','Weekly','Monthly','Quarterly','Annually'];
function blockRepKey(r){if(!r||r==='None')return 'None';if(/^Weekdays/i.test(r))return 'Weekdays';return r}
function blockApplies(b,day){
 const rep=blockRepKey(b.repeat);
 const from=b.from||b.date||'0000-01-01';
 if(day<from)return false;
 if(b.until&&day>b.until)return false;
 if(rep==='None')return b.date===day;
 if(rep==='Daily')return true;
 const n=parse(day),dow=n.getDay(),dom=n.getDate(),y=n.getFullYear(),m=n.getMonth();
 if(rep==='Weekdays')return dow>=1&&dow<=5;
 if(rep==='Weekly'){const o=parse(b.date||from);return o.getDay()===dow}
 if(rep==='Monthly'){const o=parse(b.date||from);return o.getDate()===dom}
 if(rep==='Quarterly'){
  const o=parse(b.date||from);if(o.getDate()!==dom)return false;
  const months=(y-o.getFullYear())*12+(m-o.getMonth());
  return months>=0&&months%3===0;
 }
 if(rep==='Annually'){const o=parse(b.date||from);return o.getDate()===dom&&o.getMonth()===m}
 return b.date===day;
}
function blocksOn(day){
 return S.blocks.filter(b=>blockApplies(b,day)).slice().sort((a,b)=>mins(a.start||'00:00')-mins(b.start||'00:00'));
}

function tickerHeadline(){

 if(!L.length)L.push({lvl:'ok',t:'All clear — nothing due',d:''});

function tickerPaint(){
 const sc=$('#nwScroll');if(!sc||_tickerReduce)return;
 _tickerX-=0.35;
 if(_tickerHalf>0&&-_tickerX>=_tickerHalf)_tickerX+=_tickerHalf;
 sc.style.transform='translate3d('+_tickerX.toFixed(2)+'px,0,0)';
}
function tickerLoop(){
 tickerPaint();

}

 _tickerRaf=requestAnimationFrame(tickerLoop);
}

}

function updateTicker(force){
 const el=$('#ticker');if(!el)return;
 const h=tickerHeadline(),raw=tickerItems();
 const trackKey=raw.map(x=>x.lvl+':'+x.t).join('|');
 const headKey=h.label+'|'+h.text;
 const rowHtml=()=>raw.map(x=>`<span class="nw-item"><i class="dot ${x.lvl}"></i><b>${esc(x.t)}</b>${x.d?`<span>· ${esc(x.d)}</span>`:''}</span>`).join('');
 if(!_tickerBuilt||force||!el.querySelector('#nwScroll')){
  el.innerHTML=`<div class="nw-head"><div class="nw-label ${h.cls}" id="nwLab">${esc(h.label)}</div><div class="nw-headline"><span id="nwHead">${esc(h.text)}</span></div><div class="nw-track"><div class="nw-scroll" id="nwScroll">${rowHtml()}${rowHtml()}</div></div></div>`;
  _tickerBuilt=true;_tickerTrack=trackKey;_tickerHead=headKey;_tickerX=0;
  requestAnimationFrame(()=>{tickerMeasure();tickerStart()});
  return;
 }
 if(headKey!==_tickerHead){
  _tickerHead=headKey;
  const lab=$('#nwLab'),hd=$('#nwHead');
  if(lab){lab.className='nw-label '+h.cls;lab.textContent=h.label}
  if(hd)hd.textContent=h.text;
 }
 if(trackKey!==_tickerTrack){
  _tickerTrack=trackKey;
  const sc=$('#nwScroll');if(!sc)return;
  // Swap content without killing the rAF loop — measure after paint
  sc.innerHTML=rowHtml()+rowHtml();
  requestAnimationFrame(()=>{tickerMeasure();if(_tickerHalf&&-_tickerX>=_tickerHalf)_tickerX=_tickerX%_tickerHalf});
 }
 tickerStart();
}

const LTV_SC=70000,LTV_YEAR=2026,LTV_MEMBERS=[
 {no:'1',tenant:'SONALI'},{no:'2',tenant:'TUSHAR SHA'},{no:'3',tenant:'JASPAL'},
 {no:'4',tenant:'BARKER'},{no:'5',tenant:'JASPAL'},{no:'6',tenant:'WHITNEY'},
 {no:'7',tenant:'ORR'},{no:'8',tenant:'VICRAM'},{no:'9',tenant:'VIVIAN'},{no:'10',tenant:'JAMES'}
],LTV_VENDORS_DEFAULT=[
 {name:'Security',cat:'Security'},{name:'Ultimate Security',cat:'Security'},
 {name:'Landscape',cat:'Landscape'},{name:'Bin Collection',cat:'Waste'},
 {name:'Administrative Company',cat:'Admin'},{name:'Wallace (Facilitation)',cat:'Admin'},
 {name:'ADM Assistant',cat:'Admin'}
];
function ltvMonths(year){return Array.from({length:12},(_,i)=>year+'-'+String(i+1).padStart(2,'0'))}
function ltvMonthLabel(ym){const[y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:'short'})}

function ltvMonth(){return THIS}
function ltvUnitPaid(unitId,month){
 return (S.ltvContribs||[]).filter(c=>c.unitId===unitId&&c.month===month&&c.status!=='void').reduce((t,c)=>t+(+c.amount||0),0);
}
function ltvBillsForMonth(month){
 return (S.ltvBills||[]).filter(b=>(b.month||(b.due||'').slice(0,7))===month);
}
function ltvInvoiceAnalysis(month){
 const units=(S.ltvUnits||[]).slice().sort((a,b)=>(+a.no||0)-(+b.no||0));
 const n=Math.max(1,units.length||10);
 const bills=ltvBillsForMonth(month);
 const withInv=bills.filter(b=>b.fileData||b.fileName);
 const paid=bills.filter(b=>b.status==='paid');
 const openPayable=bills.filter(b=>(b.fileData||b.fileName)&&b.status!=='paid');
 const totalAll=bills.reduce((t,b)=>t+(+b.amount||0),0);
 const totalWithInv=withInv.reduce((t,b)=>t+(+b.amount||0),0);
 const totalPaid=paid.reduce((t,b)=>t+(+b.amount||0),0);
 const totalPayable=openPayable.reduce((t,b)=>t+(+b.amount||0),0);
 // Equal share: every house contributes the same toward the invoice pool
 const shareAll=totalAll/n, shareInv=totalWithInv/n, sharePaid=totalPaid/n, sharePayable=totalPayable/n;
 const rows=units.map(u=>{
  const contrib=ltvUnitPaid(u.id,month);
  const towardInvoices=Math.min(contrib, shareInv); // how much of their SC covers invoice share
  const surplus=contrib-shareInv; // positive = helped cover others / reserve; negative = short vs equal share
  return{u,contrib,shareInv,shareAll,sharePaid,sharePayable,surplus,towardInvoices};
 });
 return{units,n,bills,withInv,paid,openPayable,totalAll,totalWithInv,totalPaid,totalPayable,shareAll,shareInv,sharePaid,sharePayable,rows};
}

function ltvYearActuals(year){
 const y=String(year),months=ltvMonths(y);
 const units=(S.ltvUnits||[]);
 const n=Math.max(1,units.length||10);
 const byMonth=months.map(m=>{
  const collected=units.reduce((t,u)=>t+ltvUnitPaid(u.id,m),0);
  const expected=n*LTV_SC;
  const bills=ltvBillsForMonth(m);
  const inv=bills.filter(b=>b.fileData||b.fileName);
  const paid=bills.filter(b=>b.status==='paid');
  const invTot=inv.reduce((t,b)=>t+(+b.amount||0),0);
  const paidTot=paid.reduce((t,b)=>t+(+b.amount||0),0);
  const byVendor={};
  inv.forEach(b=>{const k=b.vendor||b.cat||'Other';byVendor[k]=(byVendor[k]||0)+(+b.amount||0)});
  return{month:m,collected,expected,invTot,paidTot,outstandingSC:Math.max(0,expected-collected),surplus:collected-paidTot,byVendor,billCount:inv.length};
 });
 const vendorTotals={};
 byMonth.forEach(m=>Object.entries(m.byVendor).forEach(([k,v])=>{vendorTotals[k]=(vendorTotals[k]||0)+v}));
 const monthsWithData=byMonth.filter(m=>m.collected>0||m.invTot>0);
 const avgCollected=monthsWithData.length?monthsWithData.reduce((t,m)=>t+m.collected,0)/monthsWithData.length:n*LTV_SC;
 const avgInvoices=monthsWithData.length?monthsWithData.reduce((t,m)=>t+m.invTot,0)/monthsWithData.length:0;
 const avgPaid=monthsWithData.length?monthsWithData.reduce((t,m)=>t+m.paidTot,0)/monthsWithData.length:0;
 const yearCollected=byMonth.reduce((t,m)=>t+m.collected,0);
 const yearInv=byMonth.reduce((t,m)=>t+m.invTot,0);
 const yearPaid=byMonth.reduce((t,m)=>t+m.paidTot,0);
 return{year:y,months:byMonth,n,vendorTotals,monthsWithData:monthsWithData.length,avgCollected,avgInvoices,avgPaid,yearCollected,yearInv,yearPaid,expectedYear:n*LTV_SC*12};
}
function ltvBudgetProposal(fromYear){
 const act=ltvYearActuals(fromYear);
 const next=String(+fromYear+1);
 const n=act.n;
 const months=Math.max(1,act.monthsWithData);
 // Income = money actually coming in (collected SC), annualised from months with data
 const incomeAnnualised=act.monthsWithData?Math.round(act.avgCollected*12):n*LTV_SC*12;
 // Policy ceiling/floor: still show full SC capacity
 const scCapacity=n*LTV_SC*12;
 // Expenses = money actually going out (paid invoices preferred; else invoices on file), annualised
 const expBase=act.monthsWithData?(act.avgPaid>0?act.avgPaid:act.avgInvoices)*12:0;
 const vendorLines=Object.entries(act.vendorTotals).map(([name,tot])=>{
  const annualised=tot*(12/months);
  // share of expense pool by vendor weight
  const weight=act.yearInv>0?tot/act.yearInv:(1/Math.max(1,Object.keys(act.vendorTotals).length));
  const proposed=Math.round((expBase*weight)*1.05/1000)*1000; // +5% on actual run-rate
  return{name,historical:Math.round(annualised),proposed:proposed||Math.round(annualised*1.05/1000)*1000,share:(proposed||annualised)/n};
 }).sort((a,b)=>b.proposed-a.proposed);
 if(!vendorLines.length){
  ['Security','Ultimate Security','Landscape','Bin Collection','Administrative Company','Facilitation (Wallace)','ADM Assistant'].forEach(name=>{
   vendorLines.push({name,historical:0,proposed:0,share:0});
  });
 }
 let expTotal=vendorLines.reduce((t,v)=>t+v.proposed,0);
 // If no vendor split but we have paid/invoice avg, one pool line
 if(expTotal===0&&expBase>0){
  expTotal=Math.round(expBase*1.05/1000)*1000;
  vendorLines.push({name:'Estate supplier pool (from actuals)',historical:Math.round(expBase),proposed:expTotal,share:expTotal/n});
 }
 const scIncome=incomeAnnualised; // budget income = money coming in
 const reserve=scIncome-expTotal;
 const monthlySC=Math.round(scIncome/12/n);
 const monthlyExp=Math.round(expTotal/12);
 const perHouseExp=Math.round(expTotal/n/12);
 return{fromYear:String(fromYear),nextYear:next,n,scIncome,scCapacity,monthlySC,expTotal,monthlyExp,perHouseExp,reserve,vendorLines,act,incomeAnnualised,expBase};
}
function ltvReconciliation(year){
 const act=ltvYearActuals(year);
 const rows=act.months.map(m=>({
  ...m,
  status:m.collected===0&&m.invTot===0?'empty':
   Math.abs(m.collected-m.paidTot)<1?'balanced':
   m.collected>m.paidTot?'surplus':'deficit'
 }));
 return{...act,rows};
}

/* ---------- neutral savings priority matrix ---------- */
const NEED_LEVELS=['Essential','Important','Optional'];
function planDaysLeft(p){
 if(!p.deadline)return null;
 return diff(p.deadline);
}
function planPace(p){
 const target=+p.target||0,saved=+p.saved||0;
 if(!target||!p.deadline)return{expected:0,lag:0,pctPace:null};
 const start=p.created?String(p.created).slice(0,10):(p.from||null);
 let startD=start&&start<=p.deadline?start:null;
 if(!startD){
  // assume 6 months before deadline if no start
  startD=addDays(p.deadline,-180);
  if(startD>TODAY)startD=addDays(TODAY,-30);
 }
 const total=Math.max(1,diff(p.deadline)-diff(startD));
 const elapsed=Math.max(0,Math.min(total,diff(TODAY)-diff(startD)));
 const expected=target*(elapsed/total);
 const lag=expected-saved;
 const pctPace=target?Math.round((saved/Math.max(expected,1))*100):null;
 return{expected,lag,pctPace,startD,total,elapsed};
}
function planPriority(p,ctx){
 const target=+p.target||0,saved=+p.saved||0,left=Math.max(0,target-saved);
 const days=planDaysLeft(p);
 // Urgency 0–100 (deadline pressure only — objective)
 let urgency=40;
 if(days===null)urgency=35;
 else if(days<0)urgency=100;
 else if(days<=14)urgency=95;
 else if(days<=30)urgency=85;
 else if(days<=60)urgency=72;
 else if(days<=90)urgency=60;
 else if(days<=180)urgency=48;
 else urgency=Math.max(20,55-Math.floor(days/30));
 // Gap share 0–100 among open plans (fair relative need)
 const maxLeft=ctx.maxLeft||1;
 const gap=left<=0?0:Math.round(100*(left/maxLeft));
 // Pace lag 0–100 (behind linear path = higher priority)
 const pace=planPace(p);
 let paceScore=40;
 if(left<=0)paceScore=0;
 else if(pace.pctPace===null)paceScore=45;
 else if(pace.lag<=0)paceScore=Math.max(10,40-Math.min(30,Math.round((-pace.lag/target)*40)));
 else paceScore=Math.min(100,50+Math.round((pace.lag/target)*80));
 // Need level — small weight so matrix stays mostly neutral
 const needMap={Essential:100,Important:60,Optional:25};
 const need=needMap[p.needLevel]??50;
 // Weighted: time 40%, gap 35%, pace 20%, declared need 5%
 const score=Math.round(urgency*0.40+gap*0.35+paceScore*0.20+need*0.05);
 const reasons=[];
 if(days!==null&&days<0)reasons.push('Past deadline');
 else if(days!==null&&days<=30)reasons.push(days+'d left');
 if(left>0&&maxLeft>0&&left/maxLeft>=0.35)reasons.push('Large remaining amount');
 if(pace.lag>0)reasons.push('Behind pace');
 if(p.needLevel==='Essential')reasons.push('Essential');
 if(left<=0)reasons.push('Funded');
 return{score,urgency,gap,pace:paceScore,need,left,days,pctv:target?Math.min(100,Math.round(saved/target*100)):0,reasons,paceInfo:pace};
}
function rankPlans(list){
 const open=list.filter(p=>Math.max(0,(+p.target||0)-(+p.saved||0))>0);
 const maxLeft=Math.max(1,...open.map(p=>Math.max(0,(+p.target||0)-(+p.saved||0))));
 const ctx={maxLeft};
 return list.map(p=>{
  const m=planPriority(p,ctx);
  return{p,m,funded:m.left<=0};
 }).sort((a,b)=>{
  if(a.funded!==b.funded)return a.funded?1:-1;
  return b.m.score-a.m.score||(a.m.days??9999)-(b.m.days??9999);
 }).map((row,i)=>({...row,rank:row.funded?null:i+1}));
}
function isSavingsAcc(a){
 const n=((a&&a.name)||'')+' '+((a&&a.kind)||'');
 return /m-?shwari|cic|saving|sacco|money.?market|unit.?trust|invest|fixed|deposit/i.test(n);
}
function savingsAccounts(){
 return(S.accounts||[]).filter(isSavingsAcc).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
function Savings(){
 const sav=savingsAccounts();
 const balTot=sav.reduce((t,a)=>t+accBal(a),0);
 const ranked=rankPlans(S.plans);
 const pl=ranked.map(r=>r.p);
 const totalNeed=pl.reduce((t,p)=>t+Math.max(0,(+p.target||0)-(+p.saved||0)),0);
 const totalSaved=pl.reduce((t,p)=>t+(+p.saved||0),0);
 const top=ranked.find(r=>!r.funded);
 const card=row=>{
  const p=row.p,m=row.m;
  const target=+p.target||0,saved=+p.saved||0,left=m.left,pctv=m.pctv;
  const ok=row.funded,col=ok?'#3BA776':pctv>=50?'var(--amber)':'var(--red)';
  const rankLbl=ok?'<span class="pri-pill p0">Funded</span>':(row.rank===1?'<span class="pri-pill p1">#1 Priority</span>':row.rank===2?'<span class="pri-pill p2">#2</span>':'<span class="pri-pill p3">#'+row.rank+'</span>');

let reconAcc='';
function reconDiff(a){
 const book=accBal(a),stmt=+a.stmt||0;
 const items=S.recon.filter(r=>r.accId===a.id&&r.status!=='cleared');
 const unpres=items.filter(r=>r.side==='book'),uncred=items.filter(r=>r.side==='bank');
 const adjBook=book+unpres.filter(r=>r.effect==='add').reduce((t,r)=>t+(+r.amount||0),0)-unpres.filter(r=>r.effect==='less').reduce((t,r)=>t+(+r.amount||0),0);
 const adjStmt=stmt+uncred.filter(r=>r.effect==='add').reduce((t,r)=>t+(+r.amount||0),0)-uncred.filter(r=>r.effect==='less').reduce((t,r)=>t+(+r.amount||0),0);
 const red='#F0645A',green='#3BA776';
 return{book,stmt,adjBook,adjStmt,diff:Math.round((adjBook-adjStmt)*100)/100,open:items.length,stmtDate:a.stmtDate||'',monthOk:(a.stmtDate||'').slice(0,7)===THIS,reconOk:a.reconMonth===THIS,red,green};
}
function Recon(){

 const R=reconDiff(a);
 const items=S.recon.filter(r=>r.accId===a.id&&r.status!=='cleared');
 const unpres=items.filter(r=>r.side==='book'),uncred=items.filter(r=>r.side==='bank');

function form(title,fields,save){

 if(!d){console.error('dialog #dlg missing');return}
 let saved=false;
 d.innerHTML=`<form method="dialog" id="dlgform"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o)}" ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="3">${esc(f.v??'')}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.r?'required':''} ${f.t=='number'?'step="any"':''}>`}</label>`).join('')}<div class="acts"><button type="button" class="ghost" id="dlgcancel">Cancel</button><button value="ok" class="pri" id="dlgsave">Save</button></div></form>`;
 const closeCancel=()=>{saved=false;d.returnValue='cancel';try{d.close('cancel')}catch(e){d.close()}};
 const can=$('#dlgcancel');if(can)can.onclick=e=>{e.preventDefault();closeCancel()};
 d.oncancel=e=>{e.preventDefault();closeCancel()}; // Escape
 d.onclick=e=>{if(e.target===d)closeCancel()}; // backdrop
 d.onclose=()=>{
  try{
   if(d.returnValue==='ok'&&!saved){saved=true;const fd=d.querySelector('form');if(fd&&typeof save==='function')save(Object.fromEntries(new FormData(fd)))}
  }catch(err){console.error('form save',err);alert('Could not save: '+(err.message||err))}
  d.returnValue='';d.onclick=null;d.oncancel=null;d.onclose=null;
 };
 d.showModal();
}

/* Reminders fire when the app is open. For alerts while closed, add Cloud Functions + FCM (see README). */
function remind(force){
 const due=items().filter(x=>x.days<=x.remind);
 if(!due.length)return;
 const k='reminded-'+TODAY+'-'+due.map(x=>x.id).sort().join(',').slice(0,80);
 if(localStorage.getItem(k)&&!force)return;
 if('Notification'in window&&Notification.permission==='granted'){
  new Notification(due.length+' item'+(due.length>1?'s':'')+' need attention',{body:due.slice(0,6).map(x=>(x.days<0?'OVERDUE':x.days==0?'Today':'In '+x.days+'d')+': '+x.title).join('\n')});
 }
 const c=waCfg();
 if(c.on&&c.phone&&c.apikey){const msg='*Winn* '+due.length+' item(s):\n'+due.slice(0,8).map(x=>'• '+(x.days<0?'OVERDUE':x.days===0?'Today':('In '+x.days+'d'))+': '+x.title).join('\n');sendWhatsApp(msg)}
 localStorage.setItem(k,1)}
setInterval(()=>ready.tasks&&remind(),15*60*1000);
